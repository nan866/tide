<style>
:root{--bg:#0a1730;--bg2:#10224a;--card:#132a57;--line:#24427e;--yellow:#f5c71a;--blue:#3ea6ff;--text:#eef3ff;--muted:#9fb3d9;--orange:#ff9f1a;--red:#ff4d4d}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif;-webkit-text-size-adjust:100%}
body{overflow-x:hidden}
.wrap{max-width:560px;margin:0 auto;padding:0 12px calc(24px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 0 8px}
header img{width:52px;height:52px;border-radius:10px;border:2px solid var(--yellow);flex:none}
header h1{margin:0;font-size:20px;color:var(--yellow);letter-spacing:.05em}
header p{margin:2px 0 0;font-size:11px;color:var(--blue);font-weight:700;letter-spacing:.04em}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0;border-bottom:1px solid var(--line)}
.dates{display:grid;grid-template-columns:auto 1fr auto auto;gap:6px;align-items:center}
button,.btn{font:inherit;color:var(--text);background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer;min-height:40px}
button:active{background:var(--line)}
.today-btn{background:var(--yellow);color:#111;border-color:var(--yellow);font-weight:700}
.datebox{position:relative;min-width:0}
.datebox input{width:100%;min-width:0;font:inherit;font-weight:700;text-align:center;color:var(--text);background:var(--bg2);border:1px solid var(--blue);border-radius:8px;padding:7px 4px;min-height:40px;color-scheme:dark}
.search{margin-top:8px;position:relative}
.search input{width:100%;font:inherit;font-size:16px;color:var(--text);background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:9px 10px}
.results{margin:6px 0 0;padding:0;list-style:none;max-height:50vh;overflow-y:auto}
.results li button{width:100%;text-align:left;margin-top:4px;display:flex;justify-content:space-between;gap:8px}
.results .pref{color:var(--muted);font-size:12px}
.note{color:var(--muted);font-size:12px;margin:6px 2px}
h2{font-size:15px;color:var(--yellow);margin:14px 2px 8px;border-left:4px solid var(--blue);padding-left:8px}
.cards{display:grid;grid-template-columns:1fr;gap:10px}
.card{background:linear-gradient(160deg,var(--card),var(--bg2));border:1px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;min-width:0}
.card:active{border-color:var(--yellow)}
.card-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card h3{margin:0;font-size:22px}
.tag{display:inline-block;background:var(--yellow);color:#111;font-weight:700;font-size:12px;border-radius:999px;padding:2px 10px;white-space:nowrap}
.src{font-size:11px;color:var(--muted);margin-top:2px}
.card-mid{display:grid;grid-template-columns:1fr 112px;gap:8px;align-items:center;margin-top:8px}
.tt{font-size:13px;line-height:1.6}
.tt b{display:inline-block;width:3em;color:var(--blue)}
.tt .hi{color:var(--yellow)}
.spark{width:112px;height:44px;display:block}
.wx{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:13px;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center}
.wx .lbl{color:var(--muted);font-size:11px}
.w-o{color:var(--orange);font-weight:700}.w-r{color:var(--red);font-weight:700}
.arrow{display:inline-block;transition:none}
.err{background:#3a1420;border:1px solid var(--red);border-radius:10px;padding:10px;font-size:13px;margin:8px 0}
.err button{margin-top:6px}
.muted{color:var(--muted)}
.loading{color:var(--muted);font-size:13px;padding:6px 0}
/* detail */
.detail{display:none}
body.show-detail .home{display:none}
body.show-detail .detail{display:block}
.dhead{display:flex;align-items:center;gap:8px;margin-top:10px}
.dhead h2{margin:0;border:none;padding:0;font-size:22px;color:var(--text)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px;min-width:0}
.panel h4{margin:0 0 8px;color:var(--yellow);font-size:14px}
.big{width:100%;height:auto;display:block}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 10px;font-size:14px}
.kv div span{color:var(--muted);font-size:12px;display:block}
table{width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed}
th,td{padding:6px 2px;text-align:center;border-bottom:1px solid var(--line);overflow-wrap:anywhere}
th{color:var(--muted);font-weight:600;font-size:11px}
footer{margin-top:20px;font-size:11px;color:var(--muted);line-height:1.7;border-top:1px solid var(--line);padding-top:10px}
footer a{color:var(--blue)}
footer ul{margin:0;padding-left:1.2em}
</style>
</head>

// ---------- 検索 ----------
function norm(s){ return String(s||"").normalize("NFKC").replace(/\s+/g,"").replace(/[ヶケ]/g,"ケ"); }
function search(qs){
  var q = norm(qs), out = [], seen = {};
  if(!q) return out;
  SPOTS.forEach(function(sp, i){ if(norm(sp.name).indexOf(q) >= 0) out.push({spot:i, label:sp.name, sub:"ピックアップ（潮位："+sp.port+"）"}); });
  var prefHits = [];
  PREFS.forEach(function(p, i){ var b = p.replace(/[都道府県]$/,""); if(norm(p).indexOf(q) >= 0 || (q.length >= 2 && norm(b) === q.replace(/[都道府県]$/,""))) prefHits.push(i+1); });
  PORTS.forEach(function(p){
    var key = p[0]+"-"+p[1];
    if((norm(p[2]).indexOf(q) >= 0 || prefHits.indexOf(p[0]) >= 0) && !seen[key]){ seen[key] = 1; out.push({pc:p[0], hc:p[1], name:p[2], label:p[2], sub:prefName(p[0])}); }
  });
  return out;
}
var searchTimer = null;

  var ul = $("results"), qv = $("q").value, list = search(qv);
  ul.innerHTML = "";
  if(!norm(qv)) return;
  if(!list.length){ ul.innerHTML = '<li class="note">見つかりませんでした（港名・都道府県名・スポット名で探せます）</li>'; return; }
  var max = 80;
  list.slice(0, max).forEach(function(r){
    var li = document.createElement("li"), b = document.createElement("button");
    b.type = "button";
    b.innerHTML = '<span>'+esc(r.label)+'</span><span class="pref">'+esc(r.sub)+'</span>';
    b.addEventListener("click", function(){ openDetail(r.spot != null ? {spot:r.spot} : {pc:r.pc, hc:r.hc, name:r.name}); });
    li.appendChild(b); ul.appendChild(li);
  });
  if(list.length > max){ var li = document.createElement("li"); li.className = "note"; li.textContent = "ほか " + (list.length-max) + " 件。名前を詳しく入れると絞り込めます。"; ul.appendChild(li); }
}

// ---------- 起動 ----------
function render(){ if(state.view) renderDetail(); else renderHome(); }
$("date").value = state.date;
$("prev").addEventListener("click", function(){ setDate(addDays(state.date,-1)); });
$("next").addEventListener("click", function(){ setDate(addDays(state.date,1)); });
$("today").addEventListener("click", function(){ setDate(todayJST()); });
$("date").addEventListener("change", function(){ if(this.value) setDate(this.value); });
$("back").addEventListener("click", function(){ if(history.state && history.state.detail){ history.back(); } else { closeDetail(); } });
window.addEventListener("popstate", function(){ if(state.view) closeDetail(); });
$("q").addEventListener("input", function(){ clearTimeout(searchTimer); searchTimer = setTimeout(renderResults, 150); });
renderHome();
})();
</script>
</body>
</html>
